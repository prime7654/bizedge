          maxLength: 2000
        complainant:
          type: string
          format: uuid
          nullable: true
        respondent:
          type: string
          format: uuid
          nullable: true
        frequency:
          oneOf:
          - $ref: '#/components/schemas/FrequencyEnum'
          - $ref: '#/components/schemas/BlankEnum'
        occurrence_count:
          type: integer
          minimum: 1
          nullable: true
