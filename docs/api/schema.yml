      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=4
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=2
        results:
          type: array
          items:
            $ref: '#/components/schemas/MyInformationRequest'
    PaginatedTrainingList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=4
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=2
        results:
          type: array
          items:
            $ref: '#/components/schemas/Training'
    RecordMeetingRequest:
      type: object
      properties:
        meeting_date:
          type: string
          format: date
        findings:
          type: string
          minLength: 1
          maxLength: 50000
        attendees:
          type: array
          items:
            type: string
            format: uuid
      required:
      - findings
      - meeting_date
    RequestInformationRequest:
      type: object
      properties:
        prompt:
          type: string
          minLength: 1
          maxLength: 5000
        due_at:
          type: string
          format: date-time
          nullable: true
      required:
      - prompt
    Resolution:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        decision:
          allOf:
          - $ref: '#/components/schemas/DecisionEnum'
          readOnly: true
        decision_display:
          type: string
          readOnly: true
        resolution_type:
          allOf:
          - $ref: '#/components/schemas/ResolutionTypeEnum'
          readOnly: true
        formal_resolution_type:
          allOf:
          - $ref: '#/components/schemas/FormalResolutionTypeEnum'
          readOnly: true
        informal_resolution_type:
          allOf:
          - $ref: '#/components/schemas/InformalResolutionTypeEnum'
          readOnly: true
        resolution_note:
          type: string
          readOnly: true
          description: Required when either sub-type is OTHERS.
        decision_notes:
          type: string
          readOnly: true
        decided_by:
          allOf:
          - $ref: '#/components/schemas/EmployeeBrief'
          readOnly: true
        decided_at:
          type: string
          format: date-time
          readOnly: true
        pip_plan:
          allOf:
          - $ref: '#/components/schemas/PIPPlan'
          readOnly: true
      required:
      - decided_at
      - decided_by
      - decision
      - decision_display
      - decision_notes
      - formal_resolution_type
      - id
      - informal_resolution_type
      - pip_plan
      - resolution_note
      - resolution_type
    ResolutionTypeEnum:
      enum:
      - FORMAL
      - INFORMAL
      - NO_RESOLUTION_REQUIRED
      type: string
      description: |-
        * `FORMAL` - Formal resolution
        * `INFORMAL` - Informal resolution
        * `NO_RESOLUTION_REQUIRED` - No resolution required
    ResolveComplaintRequest:
      type: object
      description: |-
        HR's decision, and everything that follows from it.

        The conditional rules here mirror check constraints on the Resolution
        table. That duplication is intentional -- the constraint guarantees the
        data is sound, but reaching it means a 500. This layer turns the same rule
        into a field error.
      properties:
        decision:
          $ref: '#/components/schemas/DecisionEnum'
        resolution_type:
          $ref: '#/components/schemas/ResolutionTypeEnum'
        formal_resolution_type:
          oneOf:
          - $ref: '#/components/schemas/FormalResolutionTypeEnum'
          - $ref: '#/components/schemas/BlankEnum'
        informal_resolution_type:
          oneOf:
          - $ref: '#/components/schemas/InformalResolutionTypeEnum'
          - $ref: '#/components/schemas/BlankEnum'
        resolution_note:
          type: string
          maxLength: 5000
        decision_notes:
          type: string
          minLength: 1
          maxLength: 20000
        pip:
          allOf:
          - $ref: '#/components/schemas/PIPInputRequest'
          nullable: true
      required:
      - decision
      - decision_notes
      - resolution_type
    RespondToRequestRequest:
      type: object
      properties:
        body:
          type: string
          minLength: 1
          maxLength: 20000
      required:
      - body
    RoleEnum:
      enum:
      - COMPLAINANT
      - RESPONDENT
      - WITNESS
      - OTHER
      type: string
      description: |-
        * `COMPLAINANT` - Complainant
        * `RESPONDENT` - Respondent
        * `WITNESS` - Witness
        * `OTHER` - Other
    SourceEnum:
      enum:
      - SELF
      - HR_FOR_EMPLOYEE
      - HR_FOR_COMPANY
      type: string
      description: |-
        * `SELF` - Filed by the employee
        * `HR_FOR_EMPLOYEE` - Filed by HR on behalf of an employee
        * `HR_FOR_COMPANY` - Filed by HR on behalf of the company
    StatusEnum:
      enum:
      - PENDING
      - ANSWERED
      - EXPIRED
      type: string
      description: |-
        * `PENDING` - Pending
        * `ANSWERED` - Answered
        * `EXPIRED` - Expired
    SubjectTypeEnum:
      enum:
      - GENERAL
      - EMPLOYEE
      type: string
      description: |-
        * `GENERAL` - General grievance
        * `EMPLOYEE` - About an employee
    Training:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          readOnly: true
        description:
          type: string
          readOnly: true
      required:
      - description
      - id
      - name
    VerbEnum:
      enum:
      - FILED
      - VIEWED
      - VISIBILITY_OVERRIDDEN
      - ORPHAN_FALLBACK
      - INVESTIGATOR_APPOINTED
      - COLLABORATOR_INVITED
      - COLLABORATOR_REMOVED
      - INFORMATION_REQUESTED
      - INFORMATION_RECEIVED
      - MEETING_RECORDED
      - ATTACHMENT_ADDED
      - IDENTITY_RELEASED
      - REPORT_SUBMITTED
      - WITHDRAWAL_REQUESTED
      - WITHDRAWN
      - RESOLVED
      - REOPENED
      - DELETE_ATTEMPTED
      - DELETED
      type: string
      description: |-
        * `FILED` - Complaint filed
        * `VIEWED` - Complaint viewed
        * `VISIBILITY_OVERRIDDEN` - Visibility overridden at intake
        * `ORPHAN_FALLBACK` - Fell back to HR visibility
        * `INVESTIGATOR_APPOINTED` - Investigator appointed
        * `COLLABORATOR_INVITED` - Collaborator invited
        * `COLLABORATOR_REMOVED` - Collaborator removed
        * `INFORMATION_REQUESTED` - Information requested
        * `INFORMATION_RECEIVED` - Information received
        * `MEETING_RECORDED` - Meeting recorded
        * `ATTACHMENT_ADDED` - Attachment added
        * `IDENTITY_RELEASED` - Complainant identity released
        * `REPORT_SUBMITTED` - Investigation report submitted
        * `WITHDRAWAL_REQUESTED` - Withdrawal requested
        * `WITHDRAWN` - Complaint withdrawn
        * `RESOLVED` - Complaint resolved and closed
        * `REOPENED` - Complaint reopened
        * `DELETE_ATTEMPTED` - Deletion attempted
        * `DELETED` - Complaint deleted
    VisibilityEnum:
      enum:
      - HR
      - LINE_MANAGER
      - BOTH
      type: string
      description: |-
        * `HR` - HR only
        * `LINE_MANAGER` - Line manager only
        * `BOTH` - HR and line manager
    WithdrawComplaintRequest:
      type: object
      properties:
        reason:
          type: string
          description: Optional. Recorded on the case history.
          maxLength: 2000
    WitnessInputRequest:
      type: object
      description: |-
        A witness named at filing.

        Not a plain employee reference: the picker also accepts departments and
        "my line manager", so the payload is polymorphic by ``witness_type``.
      properties:
        witness_type:
          $ref: '#/components/schemas/WitnessTypeEnum'
        employee:
          type: string
          format: uuid
          nullable: true
        department:
          type: string
          format: uuid
          nullable: true
      required:
      - witness_type
    WitnessTypeEnum:
      enum:
      - EMPLOYEE
      - DEPARTMENT
      - LINE_MANAGER
      type: string
      description: |-
        * `EMPLOYEE` - Employee
        * `DEPARTMENT` - Department
        * `LINE_MANAGER` - Line manager
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: sessionid
