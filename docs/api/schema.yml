openapi: 3.0.3
info:
  title: BizEdge Grievances API
  version: 1.0.0
  description: Complaints, investigations and resolutions.
paths:
  /api/v1/complaints/:
    get:
      operationId: v1_complaints_list
      description: |-
        Complaints.

        Read and create only for now. State changes arrive in later steps as
        explicit actions rather than PATCH, so that every transition runs through
        the service layer and writes an audit row.
      parameters:
      - in: query
        name: complaint_type
        schema:
          type: string
          enum:
          - HOSTILE_WORK_ENVIRONMENT
          - OTHERS
          - SEXUAL_ASSAULT
          - SEXUAL_HARASSMENT
          - THEFT
          - UNSUSTAINABLE_WORKLOAD
        description: |-
          * `SEXUAL_ASSAULT` - Sexual assault
          * `SEXUAL_HARASSMENT` - Sexual harassment
          * `HOSTILE_WORK_ENVIRONMENT` - Hostile work environment
          * `THEFT` - Theft
          * `UNSUSTAINABLE_WORKLOAD` - Unsustainable workload
          * `OTHERS` - Others
      - in: query
        name: date_from
        schema:
          type: string
          format: date
      - in: query
        name: date_to
        schema:
          type: string
          format: date
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - in: query
        name: q
        schema:
          type: string
      - in: query
        name: relation
        schema:
          type: string
      - in: query
        name: reported_to
        schema:
          type: string
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      - in: query
        name: source
        schema:
          type: string
          enum:
          - HR_FOR_COMPANY
          - HR_FOR_EMPLOYEE
          - SELF
        description: |-
          * `SELF` - Filed by the employee
          * `HR_FOR_EMPLOYEE` - Filed by HR on behalf of an employee
          * `HR_FOR_COMPANY` - Filed by HR on behalf of the company
      - in: query
        name: source_tab
        schema:
          type: string
      - in: query
        name: stage
        schema:
          type: string
      - in: query
        name: state
        schema:
          type: string
          enum:
          - AWAITING_DECISION
          - RESOLVED
          - SUBMITTED
          - UNDER_INVESTIGATION
          - WITHDRAWN
        description: |-
          * `SUBMITTED` - Submitted
          * `UNDER_INVESTIGATION` - Under investigation
          * `AWAITING_DECISION` - Awaiting decision
          * `RESOLVED` - Resolved
          * `WITHDRAWN` - Withdrawn
      - in: query
        name: status
        schema:
          type: string
      - in: query
        name: subject_type
        schema:
          type: string
          enum:
          - EMPLOYEE
          - GENERAL
        description: |-
          * `GENERAL` - General grievance
          * `EMPLOYEE` - About an employee
      - in: query
        name: type
        schema:
          type: string
      - in: query
        name: visibility
        schema:
          type: string
          enum:
          - BOTH
          - HR
          - LINE_MANAGER
        description: |-
          Effective visibility, after any intake override.

          * `HR` - HR only
          * `LINE_MANAGER` - Line manager only
          * `BOTH` - HR and line manager
      tags:
      - v1
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedComplaintListList'
          description: ''
    post:
      operationId: v1_complaints_create
      description: 'File a complaint. Covers all four routes: an employee filing for
        themselves, an employee filing about a colleague, HR filing on behalf of an
        employee, and HR filing on behalf of the company.'
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ComplaintCreateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ComplaintCreateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ComplaintCreateRequest'
        required: true
      security:
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ComplaintDetail'
          description: ''
  /api/v1/complaints/{id}/:
    get:
      operationId: v1_complaints_retrieve
      description: Shape the response by access level, not by role.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this complaint.
        required: true
      tags:
      - v1
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ComplaintDetail'
          description: ''
  /api/v1/complaints/{id}/appoint-investigator/:
    post:
      operationId: v1_complaints_appoint_investigator_create
      description: Appoint an investigation lead and open the case. HR only. Pass
        `"self"` as the lead to take the case yourself, which is the normal route
        for a minor complaint. This is the point at which the respondent can first
        see the complaint, and after which it can no longer be deleted.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this complaint.
        required: true
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AppointInvestigatorRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AppointInvestigatorRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AppointInvestigatorRequest'
        required: true
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ComplaintDetail'
          description: ''
  /api/v1/complaints/{id}/attachments/:
    post:
      operationId: v1_complaints_attachments_create
      description: Attach evidence to a complaint.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this complaint.
        required: true
      tags:
      - v1
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
      security:
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Attachment'
          description: ''
  /api/v1/complaints/{id}/investigations/:
    get:
      operationId: v1_complaints_investigations_list
      description: Investigation rounds on this complaint, oldest first.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this complaint.
        required: true
      tags:
      - v1
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Investigation'
          description: ''
  /api/v1/complaints/{id}/resolution/:
    post:
      operationId: v1_complaints_resolution_create
      description: 'Record the decision and close the case. HR only. One call: the
        resolution, any PIP, its training assignments and its follow-up schedule are
        created together or not at all. Returns 409 if the case has already been resolved.'
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this complaint.
        required: true
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResolveComplaintRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ResolveComplaintRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ResolveComplaintRequest'
        required: true
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ComplaintDetail'
          description: ''
  /api/v1/complaints/{id}/resolutions/:
    get:
      operationId: v1_complaints_resolutions_list
      description: Decisions on this complaint, one per investigation round.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this complaint.
        required: true
      tags:
      - v1
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Resolution'
          description: ''
  /api/v1/complaints/{id}/timeline/:
    get:
      operationId: v1_complaints_timeline_list
      description: Case history. Requires full access to the complaint.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this complaint.
        required: true
      tags:
      - v1
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ComplaintEvent'
          description: ''
  /api/v1/complaints/{id}/withdraw/:
    post:
      operationId: v1_complaints_withdraw_create
      description: Retract a complaint. Before an investigation this closes the case
        outright. During one it records the request and hands the case to HR, who
        close it with a `WITHDRAWN_BY_COMPLAINANT` decision -- a withdrawn complaint
        may still need investigating on the company's behalf. Returns 409 once the
        case is awaiting a decision or closed.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this complaint.
        required: true
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WithdrawComplaintRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/WithdrawComplaintRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/WithdrawComplaintRequest'
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ComplaintDetail'
          description: ''
  /api/v1/complaints/metadata/:
    get:
      operationId: v1_complaints_metadata_retrieve
      description: Every option set and conditional form rule in one call. Fetch on
        load rather than hardcoding dropdowns client-side.
      tags:
      - v1
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/v1/complaints/summary/:
    get:
      operationId: v1_complaints_summary_retrieve
      description: Counts for the list tabs and status filters.
      tags:
      - v1
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/v1/departments/:
    get:
      operationId: v1_departments_list
      description: Base that refuses to return anything outside the caller's tenant.
      parameters:
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      tags:
      - v1
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedDepartmentList'
          description: ''
  /api/v1/departments/{id}/:
    get:
      operationId: v1_departments_retrieve
      description: Base that refuses to return anything outside the caller's tenant.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this department.
        required: true
      tags:
      - v1
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Department'
          description: ''
  /api/v1/employees/:
    get:
      operationId: v1_employees_list
      description: Powers Select Employee, Witness and Select Investigation Manager.
      parameters:
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      tags:
      - v1
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedEmployeeLookupList'
          description: ''
  /api/v1/employees/{id}/:
    get:
      operationId: v1_employees_retrieve
      description: Powers Select Employee, Witness and Select Investigation Manager.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this employee.
        required: true
      tags:
      - v1
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmployeeLookup'
          description: ''
  /api/v1/investigations/{id}/:
    get:
      operationId: v1_investigations_retrieve
      description: |-
        The lead's workspace.

        Read requires FULL access to the complaint; every write requires being the
        lead. HR can watch but not drive -- taking over means reassigning the case,
        which is auditable, rather than acting inside someone else's investigation.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this investigation.
        required: true
      tags:
      - v1
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvestigationDetail'
          description: ''
  /api/v1/investigations/{id}/collaborators/:
    post:
      operationId: v1_investigations_collaborators_create
      description: Add someone to the investigation. Repeating an invite is safe.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this investigation.
        required: true
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InviteCollaboratorRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/InviteCollaboratorRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/InviteCollaboratorRequest'
        required: true
      security:
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/v1/investigations/{id}/collaborators/{collaborator_id}/:
    delete:
      operationId: v1_investigations_collaborators_destroy
      description: 'Remove someone from the investigation. Soft: their answers stay
        on the record and any outstanding question is expired.'
      parameters:
      - in: path
        name: collaborator_id
        schema:
          type: string
        description: Collaborator id on this investigation.
        required: true
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this investigation.
        required: true
      tags:
      - v1
      security:
      - cookieAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/investigations/{id}/collaborators/{collaborator_id}/request-information/:
    post:
      operationId: v1_investigations_collaborators_request_information_create
      description: Ask a collaborator a question. Asking again appends to the thread
        rather than replacing the previous question.
      parameters:
      - in: path
        name: collaborator_id
        schema:
          type: string
        description: Collaborator id on this investigation.
        required: true
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this investigation.
        required: true
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RequestInformationRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/RequestInformationRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/RequestInformationRequest'
        required: true
      security:
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InformationRequest'
          description: ''
  /api/v1/investigations/{id}/meetings/:
    post:
      operationId: v1_investigations_meetings_create
      description: Record a meeting. Attendees not already on the case are added as
        collaborators.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this investigation.
        required: true
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecordMeetingRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/RecordMeetingRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/RecordMeetingRequest'
        required: true
      security:
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Meeting'
          description: ''
  /api/v1/investigations/{id}/notes/:
    post:
      operationId: v1_investigations_notes_create
      description: |-
        The lead's workspace.

        Read requires FULL access to the complaint; every write requires being the
        lead. HR can watch but not drive -- taking over means reassigning the case,
        which is auditable, rather than acting inside someone else's investigation.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this investigation.
        required: true
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InvestigationNoteRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/InvestigationNoteRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/InvestigationNoteRequest'
        required: true
      security:
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvestigationNote'
          description: ''
  /api/v1/investigations/{id}/submit-report/:
    post:
      operationId: v1_investigations_submit_report_create
      description: Submit the report and hand the case back to HR for a decision.
        Returns 409 if it has already been submitted.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this investigation.
        required: true
      tags:
      - v1
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvestigationDetail'
          description: ''
  /api/v1/me/information-requests/:
    get:
      operationId: v1_me_information_requests_list
      description: |-
        A collaborator's inbox.

        The narrowest surface in the module. Someone asked to give evidence can
        list the questions put to them and answer one. They cannot reach the
        complaint, the investigation, other collaborators, or anyone else's answer
        through this viewset -- there is no route that would let them.
      parameters:
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      tags:
      - v1
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedMyInformationRequestList'
          description: ''
  /api/v1/me/information-requests/{id}/respond/:
    post:
      operationId: v1_me_information_requests_respond_create
      description: Answer a question that was put to you.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this information request.
        required: true
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RespondToRequestRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/RespondToRequestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/RespondToRequestRequest'
        required: true
      security:
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/v1/trainings/:
    get:
      operationId: v1_trainings_list
      description: Training catalogue for the PIP flow.
      parameters:
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      tags:
      - v1
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedTrainingList'
          description: ''
  /api/v1/trainings/{id}/:
    get:
      operationId: v1_trainings_retrieve
      description: Training catalogue for the PIP flow.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this training.
        required: true
      tags:
      - v1
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Training'
          description: ''
components:
  schemas:
    AppointInvestigatorRequest:
      type: object
      description: |-
        Triage input.

        ``lead`` accepts an employee id, or the literal ``"self"`` for HR taking
        the case themselves -- which per Q4 is the normal route for a minor
        complaint.
      properties:
        lead:
          type: string
          minLength: 1
          description: Employee id, or "self" to assign the case to yourself.
        due_date:
          type: string
          format: date
          nullable: true
          description: When the investigation should conclude. Set by HR at triage.
      required:
      - lead
    Attachment:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        original_filename:
          type: string
          readOnly: true
        size_bytes:
          type: integer
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - id
      - original_filename
      - size_bytes
    BlankEnum:
      enum:
      - ''
    ComplaintCreateRequest:
      type: object
      description: |-
        All four filing routes.

        One serializer rather than four, because the routes differ by a handful of
        required fields rather than by shape, and four near-identical serializers
        drift apart.
