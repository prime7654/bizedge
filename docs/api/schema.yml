openapi: 3.0.3
info:
  title: BizEdge Grievances API
  version: 1.0.0
  description: Complaints, investigations and resolutions.
paths:
  /api/v1/complaints/:
    get:
      operationId: v1_complaints_list
      description: |-
        Complaints.

        Read and create only for now. State changes arrive in later steps as
        explicit actions rather than PATCH, so that every transition runs through
        the service layer and writes an audit row.
      parameters:
      - in: query
        name: complaint_type
        schema:
          type: string
          enum:
          - HOSTILE_WORK_ENVIRONMENT
          - OTHERS
          - SEXUAL_ASSAULT
          - SEXUAL_HARASSMENT
          - THEFT
          - UNSUSTAINABLE_WORKLOAD
        description: |-
          * `SEXUAL_ASSAULT` - Sexual assault
          * `SEXUAL_HARASSMENT` - Sexual harassment
          * `HOSTILE_WORK_ENVIRONMENT` - Hostile work environment
          * `THEFT` - Theft
          * `UNSUSTAINABLE_WORKLOAD` - Unsustainable workload
          * `OTHERS` - Others
      - in: query
        name: date_from
        schema:
          type: string
          format: date
      - in: query
        name: date_to
        schema:
          type: string
          format: date
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - in: query
        name: q
        schema:
          type: string
      - in: query
        name: relation
        schema:
          type: string
      - in: query
        name: reported_to
        schema:
          type: string
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      - in: query
        name: source
        schema:
          type: string
          enum:
          - HR_FOR_COMPANY
          - HR_FOR_EMPLOYEE
          - SELF
        description: |-
          * `SELF` - Filed by the employee
          * `HR_FOR_EMPLOYEE` - Filed by HR on behalf of an employee
          * `HR_FOR_COMPANY` - Filed by HR on behalf of the company
      - in: query
        name: source_tab
        schema:
          type: string
      - in: query
        name: stage
        schema:
          type: string
      - in: query
        name: state
        schema:
          type: string
          enum:
          - AWAITING_DECISION
          - RESOLVED
          - SUBMITTED
          - UNDER_INVESTIGATION
          - WITHDRAWN
        description: |-
          * `SUBMITTED` - Submitted
          * `UNDER_INVESTIGATION` - Under investigation
          * `AWAITING_DECISION` - Awaiting decision
          * `RESOLVED` - Resolved
          * `WITHDRAWN` - Withdrawn
      - in: query
        name: status
        schema:
          type: string
      - in: query
        name: subject_type
        schema:
          type: string
          enum:
          - EMPLOYEE
          - GENERAL
        description: |-
          * `GENERAL` - General grievance
          * `EMPLOYEE` - About an employee
      - in: query
        name: type
        schema:
          type: string
      - in: query
        name: visibility
        schema:
          type: string
          enum:
          - BOTH
          - HR
          - LINE_MANAGER
        description: |-
          Effective visibility, after any intake override.

          * `HR` - HR only
          * `LINE_MANAGER` - Line manager only
          * `BOTH` - HR and line manager
      tags:
      - v1
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedComplaintListList'
          description: ''
    post:
      operationId: v1_complaints_create
      description: 'File a complaint. Covers all four routes: an employee filing for
        themselves, an employee filing about a colleague, HR filing on behalf of an
        employee, and HR filing on behalf of the company.'
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ComplaintCreateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ComplaintCreateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ComplaintCreateRequest'
        required: true
      security:
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ComplaintDetail'
          description: ''
  /api/v1/complaints/{id}/:
    get:
      operationId: v1_complaints_retrieve
      description: Shape the response by access level, not by role.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this complaint.
        required: true
      tags:
      - v1
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ComplaintDetail'
          description: ''
  /api/v1/complaints/{id}/attachments/:
    post:
      operationId: v1_complaints_attachments_create
      description: Attach evidence to a complaint.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this complaint.
        required: true
      tags:
      - v1
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
      security:
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Attachment'
          description: ''
  /api/v1/complaints/{id}/timeline/:
    get:
      operationId: v1_complaints_timeline_list
      description: Case history. Requires full access to the complaint.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this complaint.
        required: true
      tags:
      - v1
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ComplaintEvent'
          description: ''
  /api/v1/complaints/metadata/:
    get:
      operationId: v1_complaints_metadata_retrieve
      description: Every option set and conditional form rule in one call. Fetch on
        load rather than hardcoding dropdowns client-side.
      tags:
      - v1
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/v1/complaints/summary/:
    get:
      operationId: v1_complaints_summary_retrieve
      description: Counts for the list tabs and status filters.
      tags:
      - v1
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/v1/departments/:
    get:
      operationId: v1_departments_list
      description: Base that refuses to return anything outside the caller's tenant.
      parameters:
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      tags:
      - v1
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedDepartmentList'
          description: ''
  /api/v1/departments/{id}/:
    get:
      operationId: v1_departments_retrieve
      description: Base that refuses to return anything outside the caller's tenant.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this department.
        required: true
      tags:
      - v1
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Department'
          description: ''
  /api/v1/employees/:
    get:
      operationId: v1_employees_list
      description: Powers Select Employee, Witness and Select Investigation Manager.
      parameters:
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      tags:
      - v1
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedEmployeeLookupList'
          description: ''
  /api/v1/employees/{id}/:
    get:
      operationId: v1_employees_retrieve
      description: Powers Select Employee, Witness and Select Investigation Manager.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this employee.
        required: true
      tags:
      - v1
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmployeeLookup'
          description: ''
  /api/v1/trainings/:
    get:
      operationId: v1_trainings_list
      description: Training catalogue for the PIP flow.
      parameters:
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      tags:
      - v1
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedTrainingList'
          description: ''
  /api/v1/trainings/{id}/:
    get:
      operationId: v1_trainings_retrieve
      description: Training catalogue for the PIP flow.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this training.
        required: true
      tags:
      - v1
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Training'
          description: ''
components:
  schemas:
    Attachment:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        original_filename:
          type: string
          readOnly: true
        size_bytes:
          type: integer
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - id
      - original_filename
      - size_bytes
    BlankEnum:
      enum:
      - ''
    ComplaintCreateRequest:
      type: object
      description: |-
        All four filing routes.

        One serializer rather than four, because the routes differ by a handful of
        required fields rather than by shape, and four near-identical serializers
        drift apart.
      properties:
        source:
          $ref: '#/components/schemas/SourceEnum'
        subject_type:
          $ref: '#/components/schemas/SubjectTypeEnum'
        complaint_type:
          $ref: '#/components/schemas/ComplaintTypeEnum'
        complaint_type_note:
          type: string
          maxLength: 2000
        complainant:
          type: string
          format: uuid
          nullable: true
        respondent:
          type: string
          format: uuid
          nullable: true
        frequency:
          oneOf:
          - $ref: '#/components/schemas/FrequencyEnum'
          - $ref: '#/components/schemas/BlankEnum'
        occurrence_count:
          type: integer
          minimum: 1
          nullable: true
        incident_date:
          type: string
          format: date
          nullable: true
        description:
          type: string
          minLength: 1
          maxLength: 20000
        visibility:
          $ref: '#/components/schemas/VisibilityEnum'
        witnesses:
          type: array
          items:
            $ref: '#/components/schemas/WitnessInputRequest'
      required:
      - complaint_type
      - description
      - source
      - subject_type
      - visibility
    ComplaintDetail:
      type: object
      description: Full detail for anyone with FULL access.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        reference:
          type: string
          readOnly: true
          description: Human-readable case reference, e.g. CMP-2026-00184. Unique
            within an organisation, not globally -- each tenant numbers from 1.
        complaint_type:
          allOf:
          - $ref: '#/components/schemas/ComplaintTypeEnum'
          readOnly: true
        complaint_type_display:
          type: string
          readOnly: true
        complaint_type_note:
          type: string
          readOnly: true
          description: Free text describing an OTHERS complaint. Stored for the case
            record and reporting. Never used as a filter dimension.
        subject_type:
          allOf:
          - $ref: '#/components/schemas/SubjectTypeEnum'
          readOnly: true
        source:
          allOf:
          - $ref: '#/components/schemas/SourceEnum'
          readOnly: true
        state:
          allOf:
          - $ref: '#/components/schemas/ComplaintStateEnum'
          readOnly: true
        status:
          type: string
          readOnly: true
        stage:
          type: string
          readOnly: true
        visibility:
          allOf:
          - $ref: '#/components/schemas/VisibilityEnum'
          readOnly: true
          description: |-
            Effective visibility, after any intake override.

            * `HR` - HR only
            * `LINE_MANAGER` - Line manager only
            * `BOTH` - HR and line manager
        due_date:
          type: string
          format: date
          readOnly: true
          nullable: true
          description: Set by HR when an investigator is appointed. Null before that.
        complainant:
          allOf:
          - $ref: '#/components/schemas/EmployeeBrief'
          nullable: true
          readOnly: true
        respondent:
          allOf:
          - $ref: '#/components/schemas/EmployeeBrief'
          nullable: true
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        description:
          type: string
          readOnly: true
        incident_date:
          type: string
          format: date
          readOnly: true
          nullable: true
        frequency:
          allOf:
          - $ref: '#/components/schemas/FrequencyEnum'
          readOnly: true
        occurrence_count:
          type: integer
          readOnly: true
          nullable: true
        filed_by:
          allOf:
          - $ref: '#/components/schemas/EmployeeBrief'
          readOnly: true
        witnesses:
          type: array
          items:
            $ref: '#/components/schemas/ComplaintWitness'
          readOnly: true
        attachments:
          type: array
          items:
            $ref: '#/components/schemas/Attachment'
          readOnly: true
        visibility_requested:
          allOf:
          - $ref: '#/components/schemas/VisibilityEnum'
          readOnly: true
          description: |-
            What the complainant actually selected. Differs from `visibility` when the complaint is about their own line manager and was forced to HR. Audit needs the original choice.

            * `HR` - HR only
            * `LINE_MANAGER` - Line manager only
            * `BOTH` - HR and line manager
        complainant_identity_released:
          type: boolean
          readOnly: true
          description: The respondent sees the allegation but not who filed it, unless
            HR explicitly releases the identity.
      required:
      - attachments
      - complainant
      - complainant_identity_released
      - complaint_type
      - complaint_type_display
      - complaint_type_note
      - created_at
      - description
      - due_date
      - filed_by
      - frequency
      - id
      - incident_date
      - occurrence_count
      - reference
      - respondent
      - source
      - stage
      - state
      - status
      - subject_type
      - visibility
      - visibility_requested
      - witnesses
    ComplaintEvent:
      type: object
      description: One row of the case timeline.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        verb:
          allOf:
          - $ref: '#/components/schemas/VerbEnum'
          readOnly: true
        verb_display:
          type: string
          readOnly: true
        actor:
          allOf:
          - $ref: '#/components/schemas/EmployeeBrief'
          readOnly: true
        from_state:
          allOf:
          - $ref: '#/components/schemas/ComplaintStateEnum'
          readOnly: true
        to_state:
          allOf:
          - $ref: '#/components/schemas/ComplaintStateEnum'
          readOnly: true
        payload:
          readOnly: true
        occurred_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - actor
      - from_state
      - id
      - occurred_at
      - payload
      - to_state
      - verb
      - verb_display
    ComplaintList:
      type: object
      description: |-
        Row shape for complaint lists.

        ``status`` and ``stage`` are derived from ``state``, never stored -- see
        the note in enums.py about why.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        reference:
          type: string
          readOnly: true
          description: Human-readable case reference, e.g. CMP-2026-00184. Unique
            within an organisation, not globally -- each tenant numbers from 1.
        complaint_type:
          allOf:
          - $ref: '#/components/schemas/ComplaintTypeEnum'
          readOnly: true
        complaint_type_display:
          type: string
          readOnly: true
        complaint_type_note:
          type: string
          readOnly: true
          description: Free text describing an OTHERS complaint. Stored for the case
            record and reporting. Never used as a filter dimension.
        subject_type:
          allOf:
          - $ref: '#/components/schemas/SubjectTypeEnum'
          readOnly: true
        source:
          allOf:
          - $ref: '#/components/schemas/SourceEnum'
          readOnly: true
        state:
          allOf:
          - $ref: '#/components/schemas/ComplaintStateEnum'
          readOnly: true
        status:
          type: string
          readOnly: true
        stage:
          type: string
          readOnly: true
        visibility:
          allOf:
          - $ref: '#/components/schemas/VisibilityEnum'
          readOnly: true
          description: |-
            Effective visibility, after any intake override.

            * `HR` - HR only
            * `LINE_MANAGER` - Line manager only
            * `BOTH` - HR and line manager
        due_date:
          type: string
          format: date
          readOnly: true
          nullable: true
          description: Set by HR when an investigator is appointed. Null before that.
        complainant:
          allOf:
          - $ref: '#/components/schemas/EmployeeBrief'
          nullable: true
          readOnly: true
        respondent:
          allOf:
          - $ref: '#/components/schemas/EmployeeBrief'
          nullable: true
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - complainant
      - complaint_type
      - complaint_type_display
      - complaint_type_note
      - created_at
      - due_date
      - id
      - reference
      - respondent
      - source
      - stage
      - state
      - status
      - subject_type
      - visibility
    ComplaintStateEnum:
      enum:
      - SUBMITTED
      - UNDER_INVESTIGATION
      - AWAITING_DECISION
      - RESOLVED
      - WITHDRAWN
      type: string
      description: |-
        * `SUBMITTED` - Submitted
        * `UNDER_INVESTIGATION` - Under investigation
        * `AWAITING_DECISION` - Awaiting decision
        * `RESOLVED` - Resolved
        * `WITHDRAWN` - Withdrawn
    ComplaintTypeEnum:
      enum:
      - SEXUAL_ASSAULT
      - SEXUAL_HARASSMENT
      - HOSTILE_WORK_ENVIRONMENT
      - THEFT
      - UNSUSTAINABLE_WORKLOAD
      - OTHERS
      type: string
      description: |-
        * `SEXUAL_ASSAULT` - Sexual assault
        * `SEXUAL_HARASSMENT` - Sexual harassment
        * `HOSTILE_WORK_ENVIRONMENT` - Hostile work environment
        * `THEFT` - Theft
        * `UNSUSTAINABLE_WORKLOAD` - Unsustainable workload
        * `OTHERS` - Others
    ComplaintWitness:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        witness_type:
          allOf:
          - $ref: '#/components/schemas/WitnessTypeEnum'
          readOnly: true
        employee:
          allOf:
          - $ref: '#/components/schemas/EmployeeBrief'
          readOnly: true
        department_name:
          type: string
          readOnly: true
      required:
      - department_name
      - employee
      - id
      - witness_type
    Department:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          readOnly: true
      required:
      - id
      - name
    EmployeeBrief:
      type: object
      description: Minimal employee representation for embedding in complaint payloads.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        full_name:
          type: string
          readOnly: true
        job_title:
          type: string
          readOnly: true
      required:
      - full_name
      - id
      - job_title
    EmployeeLookup:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        full_name:
          type: string
          readOnly: true
        job_title:
          type: string
          readOnly: true
        department:
          type: string
          format: uuid
          readOnly: true
          nullable: true
        department_name:
          type: string
          readOnly: true
      required:
      - department
      - department_name
      - full_name
      - id
      - job_title
    FrequencyEnum:
      enum:
      - ONE_TIME
      - REPEAT_BEHAVIOR
      type: string
      description: |-
        * `ONE_TIME` - One time
        * `REPEAT_BEHAVIOR` - Repeat behaviour
    PaginatedComplaintListList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=4
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=2
        results:
          type: array
          items:
            $ref: '#/components/schemas/ComplaintList'
    PaginatedDepartmentList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=4
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=2
        results:
          type: array
          items:
            $ref: '#/components/schemas/Department'
    PaginatedEmployeeLookupList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=4
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=2
        results:
          type: array
          items:
            $ref: '#/components/schemas/EmployeeLookup'
    PaginatedTrainingList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=4
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=2
        results:
          type: array
          items:
            $ref: '#/components/schemas/Training'
    SourceEnum:
      enum:
      - SELF
      - HR_FOR_EMPLOYEE
      - HR_FOR_COMPANY
      type: string
      description: |-
        * `SELF` - Filed by the employee
        * `HR_FOR_EMPLOYEE` - Filed by HR on behalf of an employee
        * `HR_FOR_COMPANY` - Filed by HR on behalf of the company
    SubjectTypeEnum:
      enum:
      - GENERAL
      - EMPLOYEE
      type: string
      description: |-
        * `GENERAL` - General grievance
        * `EMPLOYEE` - About an employee
    Training:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          readOnly: true
        description:
          type: string
          readOnly: true
      required:
      - description
      - id
      - name
    VerbEnum:
      enum:
      - FILED
      - VIEWED
      - VISIBILITY_OVERRIDDEN
      - ORPHAN_FALLBACK
      - INVESTIGATOR_APPOINTED
      - COLLABORATOR_INVITED
      - COLLABORATOR_REMOVED
      - INFORMATION_REQUESTED
      - INFORMATION_RECEIVED
      - MEETING_RECORDED
      - ATTACHMENT_ADDED
      - IDENTITY_RELEASED
      - REPORT_SUBMITTED
      - WITHDRAWAL_REQUESTED
      - WITHDRAWN
      - RESOLVED
      - REOPENED
      - DELETE_ATTEMPTED
      - DELETED
      type: string
      description: |-
        * `FILED` - Complaint filed
        * `VIEWED` - Complaint viewed
        * `VISIBILITY_OVERRIDDEN` - Visibility overridden at intake
        * `ORPHAN_FALLBACK` - Fell back to HR visibility
        * `INVESTIGATOR_APPOINTED` - Investigator appointed
        * `COLLABORATOR_INVITED` - Collaborator invited
        * `COLLABORATOR_REMOVED` - Collaborator removed
        * `INFORMATION_REQUESTED` - Information requested
        * `INFORMATION_RECEIVED` - Information received
        * `MEETING_RECORDED` - Meeting recorded
        * `ATTACHMENT_ADDED` - Attachment added
        * `IDENTITY_RELEASED` - Complainant identity released
        * `REPORT_SUBMITTED` - Investigation report submitted
        * `WITHDRAWAL_REQUESTED` - Withdrawal requested
        * `WITHDRAWN` - Complaint withdrawn
        * `RESOLVED` - Complaint resolved and closed
        * `REOPENED` - Complaint reopened
        * `DELETE_ATTEMPTED` - Deletion attempted
        * `DELETED` - Complaint deleted
    VisibilityEnum:
      enum:
      - HR
      - LINE_MANAGER
      - BOTH
      type: string
      description: |-
        * `HR` - HR only
        * `LINE_MANAGER` - Line manager only
        * `BOTH` - HR and line manager
    WitnessInputRequest:
      type: object
      description: |-
        A witness named at filing.

        Not a plain employee reference: the picker also accepts departments and
        "my line manager", so the payload is polymorphic by ``witness_type``.
      properties:
        witness_type:
          $ref: '#/components/schemas/WitnessTypeEnum'
        employee:
          type: string
          format: uuid
          nullable: true
        department:
          type: string
          format: uuid
          nullable: true
      required:
      - witness_type
    WitnessTypeEnum:
      enum:
      - EMPLOYEE
      - DEPARTMENT
      - LINE_MANAGER
      type: string
      description: |-
        * `EMPLOYEE` - Employee
        * `DEPARTMENT` - Department
        * `LINE_MANAGER` - Line manager
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: sessionid
