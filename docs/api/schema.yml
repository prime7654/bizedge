          type: string
          format: date
          nullable: true
        description:
          type: string
          minLength: 1
          maxLength: 20000
        visibility:
          $ref: '#/components/schemas/VisibilityEnum'
        witnesses:
          type: array
          items:
            $ref: '#/components/schemas/WitnessInputRequest'
      required:
      - complaint_type
      - description
      - source
      - subject_type
      - visibility
    ComplaintDetail:
      type: object
      description: Full detail for anyone with FULL access.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        reference:
          type: string
          readOnly: true
          description: Human-readable case reference, e.g. CMP-2026-00184. Unique
            within an organisation, not globally -- each tenant numbers from 1.
        complaint_type:
          allOf:
          - $ref: '#/components/schemas/ComplaintTypeEnum'
          readOnly: true
        complaint_type_display:
          type: string
          readOnly: true
        complaint_type_note:
          type: string
          readOnly: true
          description: Free text describing an OTHERS complaint. Stored for the case
            record and reporting. Never used as a filter dimension.
        subject_type:
          allOf:
          - $ref: '#/components/schemas/SubjectTypeEnum'
          readOnly: true
        source:
          allOf:
          - $ref: '#/components/schemas/SourceEnum'
          readOnly: true
        state:
          allOf:
          - $ref: '#/components/schemas/ComplaintStateEnum'
          readOnly: true
        status:
          type: string
          readOnly: true
        stage:
          type: string
          readOnly: true
        visibility:
          allOf:
          - $ref: '#/components/schemas/VisibilityEnum'
          readOnly: true
          description: |-
            Effective visibility, after any intake override.

            * `HR` - HR only
            * `LINE_MANAGER` - Line manager only
            * `BOTH` - HR and line manager
        due_date:
          type: string
          format: date
          readOnly: true
          nullable: true
          description: Set by HR when an investigator is appointed. Null before that.
        complainant:
          allOf:
          - $ref: '#/components/schemas/EmployeeBrief'
          nullable: true
          readOnly: true
        respondent:
          allOf:
          - $ref: '#/components/schemas/EmployeeBrief'
          nullable: true
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        description:
          type: string
          readOnly: true
        incident_date:
          type: string
          format: date
          readOnly: true
          nullable: true
        frequency:
          allOf:
          - $ref: '#/components/schemas/FrequencyEnum'
          readOnly: true
        occurrence_count:
          type: integer
          readOnly: true
          nullable: true
        filed_by:
          allOf:
          - $ref: '#/components/schemas/EmployeeBrief'
          readOnly: true
        witnesses:
          type: array
          items:
            $ref: '#/components/schemas/ComplaintWitness'
          readOnly: true
        attachments:
          type: array
          items:
            $ref: '#/components/schemas/Attachment'
          readOnly: true
        visibility_requested:
          allOf:
          - $ref: '#/components/schemas/VisibilityEnum'
          readOnly: true
          description: |-
            What the complainant actually selected. Differs from `visibility` when the complaint is about their own line manager and was forced to HR. Audit needs the original choice.

            * `HR` - HR only
            * `LINE_MANAGER` - Line manager only
            * `BOTH` - HR and line manager
        complainant_identity_released:
          type: boolean
          readOnly: true
          description: The respondent sees the allegation but not who filed it, unless
            HR explicitly releases the identity.
        available_transitions:
          type: array
          items:
            type: string
          readOnly: true
        investigation:
          allOf:
          - $ref: '#/components/schemas/Investigation'
          nullable: true
          readOnly: true
        resolution:
          type: object
          additionalProperties: {}
          nullable: true
          readOnly: true
